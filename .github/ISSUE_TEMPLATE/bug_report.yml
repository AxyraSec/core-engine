name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Do **not** open an issue. See [SECURITY.md](https://github.com/AxyraSec/core-engine/blob/main/SECURITY.md).
        Do not paste secrets, tokens or customer data.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Send ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image digest or commit.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with secrets removed.
      render: text
